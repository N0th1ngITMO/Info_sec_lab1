name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

env:
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Build with Gradle
      run: ./gradlew clean compileJava
    
    - name: Run tests
      run: ./gradlew test
    
    - name: SAST - Run SpotBugs
      run: |
        echo "=== Running SAST with SpotBugs ==="
        ./gradlew spotbugsMain -Pspotbugs.ignoreFailures=true || echo "SAST completed with findings"
        echo "SAST report: build/reports/spotbugs/main.html"
    
    - name: Upload SAST reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: sast-spotbugs-reports
        path: build/reports/spotbugs/
    
    - name: SCA - Setup Snyk
      if: env.SNYK_TOKEN != ''
      run: |
        echo "=== Setting up Snyk for SCA ==="
        # Автоматическая установка Snyk CLI
        curl --compressed -o- -L https://cli.snyk.io/install.sh | sh
        # Проверка версии
        snyk --version
    
    - name: SCA - Run Snyk Test (Dependencies)
      if: env.SNYK_TOKEN != ''
      run: |
        echo "=== Running Snyk for dependency vulnerability scanning ==="
        snyk test --all-projects --severity-threshold=high --json > snyk-deps-report.json || true
        snyk test --all-projects --severity-threshold=high > snyk-deps-report.txt || true
        
        if [ -f snyk-deps-report.json ]; then
          echo "Snyk dependencies report generated"
        else
          echo "Warning: Could not generate Snyk dependencies report"
        fi
    
    - name: SCA - Run Snyk Code (SAST)
      if: env.SNYK_TOKEN != ''
      run: |
        echo "=== Running Snyk Code for static code analysis ==="
        snyk code test --severity-threshold=high --json > snyk-code-report.json || true
        snyk code test --severity-threshold=high > snyk-code-report.txt || true
        
        if [ -f snyk-code-report.json ]; then
          echo "Snyk code report generated"
        fi
    
    - name: SCA - Run Snyk via Gradle plugin
      if: env.SNYK_TOKEN != ''
      run: |
        echo "=== Running Snyk through Gradle plugin ==="
        ./gradlew snykTest --continue || echo "Snyk scan completed"
    
    - name: Upload Snyk reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sca-snyk-reports
        path: |
          snyk-*.json
          snyk-*.txt
        retention-days: 7
    
    - name: SCA - Fallback (if no Snyk token)
      if: env.SNYK_TOKEN == ''
      run: |
        echo "=== Snyk token not found, using Gradle dependency report ==="
        echo "Note: Set SNYK_TOKEN secret in repository settings for full SCA"
        ./gradlew dependencies --configuration runtimeClasspath > dependency-report.txt
        echo "Basic dependency report generated"
    
    - name: Upload Fallback reports
      if: env.SNYK_TOKEN == ''
      uses: actions/upload-artifact@v4
      with:
        name: fallback-dependency-report
        path: dependency-report.txt
    
    - name: Build JAR
      run: ./gradlew bootJar
    
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: secure-api-jar
        path: build/libs/*.jar
    
    - name: Generate Security Summary
      if: always()
      run: |
        echo "## Security Scanning Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### SAST (Static Application Security Testing)" >> $GITHUB_STEP_SUMMARY
        echo "- **Tool**: SpotBugs" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: Completed" >> $GITHUB_STEP_SUMMARY
        echo "- **Reports**: Available in artifacts (sast-spotbugs-reports)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "$SNYK_TOKEN" != "" ]; then
          echo "### SCA (Software Composition Analysis)" >> $GITHUB_STEP_SUMMARY
          echo "- **Tool**: Snyk" >> $GITHUB_STEP_SUMMARY
          echo "- **Scans**:" >> $GITHUB_STEP_SUMMARY
          echo "  - Dependency vulnerability scanning" >> $GITHUB_STEP_SUMMARY
          echo "  - Static code analysis (Snyk Code)" >> $GITHUB_STEP_SUMMARY
          echo "- **Reports**: Available in artifacts (sca-snyk-reports)" >> $GITHUB_STEP_SUMMARY
        else
          echo "### SCA (Software Composition Analysis)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Snyk token not configured" >> $GITHUB_STEP_SUMMARY
          echo "- **Note**: Add SNYK_TOKEN secret in repository settings for full SCA" >> $GITHUB_STEP_SUMMARY
          echo "- **Fallback**: Basic dependency report generated" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Build Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- Secure API JAR file generated and uploaded" >> $GITHUB_STEP_SUMMARY
