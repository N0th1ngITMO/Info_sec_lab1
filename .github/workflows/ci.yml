name: Security CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew clean build
      
      - name: SAST - SpotBugs
        run: ./gradlew spotbugsMain -Pspotbugs.ignoreFailures=true
      
      - name: SCA - Setup Snyk
        uses: snyk/actions/setup@master
      
      - name: SCA - Snyk Auth
        run: snyk auth ${{ secrets.SNYK_TOKEN }}
      
      - name: SCA - Snyk Test
        run: |
          echo "=== Scanning src/main dependencies ==="
          snyk test --file=build.gradle \
            --all-projects \
            --severity-threshold=high \
            --json-file-output=snyk-main-deps.json
          
          echo "=== Scanning src/main code ==="
          snyk code test src/main/java \
            --severity-threshold=high \
            --json-file-output=snyk-main-code.json
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            build/reports/spotbugs/
            snyk-*.json
            build/libs/*.jar
