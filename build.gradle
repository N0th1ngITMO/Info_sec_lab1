plugins {
    id 'java'
    id 'org.springframework.boot' version '3.1.5'
    id 'io.spring.dependency-management' version '1.1.3'
    id 'com.github.spotbugs' version '5.0.14'
    id 'io.snyk.gradle.plugin.snykplugin' version '0.4'
}

group = 'com.example'
version = '1.0.0'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Database
    implementation 'org.xerial:sqlite-jdbc:3.42.0.0'
    implementation 'org.hibernate.orm:hibernate-community-dialects:6.2.7.Final'

    // Security & Utilities
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.apache.commons:commons-text:1.10.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'

    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

spotbugs {
    ignoreFailures = false
    showStackTraces = true
    showProgress = true
    effort = 'max'
    reportLevel = 'low'
    reportsDir = file("$buildDir/reports/spotbugs")
}

tasks.named('spotbugsMain') {
    reports {
        xml.enabled = true
        html.enabled = true
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// Задача для запуска security checks
task securityCheck {
    dependsOn 'dependencyCheckAnalyze', 'spotbugsMain'
    doLast {
        println 'Security checks completed'
    }
}

bootJar {
    archiveFileName = 'secure-api.jar'
}
